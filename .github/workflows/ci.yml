name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "20.19.0"
  PNPM_VERSION: "12"
  WAILS_VERSION: "v3.0.0-beta.23"

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check release metadata
        shell: bash
        run: |
          set -euo pipefail
          require_text() {
            local file="$1"
            local expected="$2"
            if ! grep -Fq "${expected}" "${file}"; then
              echo "::error file=${file}::Expected release metadata '${expected}'."
              exit 1
            fi
          }

          version="$(sed -n 's/^  version: "\([^"]*\)"/\1/p' build/config.yml)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=build/config.yml::Expected one stable semantic version, found '${version}'."
            exit 1
          fi
          require_text frontend/package.json "\"version\": \"${version}\""
          require_text frontend/index.html "<span class=\"version-badge\">v${version}</span>"
          require_text build/linux/nfpm/nfpm.yaml "version: \"${version}\""
          require_text build/darwin/Info.plist "<string>${version}</string>"
          require_text build/windows/info.json "\"file_version\": \"${version}\""
          if ! awk -v heading="## [${version}]" '$0 == heading || index($0, heading " - ") == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Expected a '## [${version}]' release heading, optionally followed by a date."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run Go tests with race detection and coverage
        run: |
          go test -race -coverprofile=coverage.out . ./cmd/... ./internal/...
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v total="${total}" 'BEGIN { if (total < 45) { printf "Go coverage %.1f%% is below 45%%\n", total; exit 1 } }'

      - name: Run Go vet
        run: go vet . ./cmd/... ./internal/...

      - name: Check frontend types
        run: pnpm --dir frontend check

      - name: Run frontend tests
        run: pnpm --dir frontend test

      - name: Build frontend
        run: pnpm --dir frontend build
