name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "24"
  PNPM_VERSION: "12"
  WAILS_VERSION: "v3.0.0-beta.23"

jobs:
  metadata:
    name: Resolve package metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      linux_matrix: ${{ steps.assets.outputs.linux_matrix }}
      build_linux: ${{ steps.assets.outputs.build_linux }}
      build_macos: ${{ steps.assets.outputs.build_macos }}
      build_windows: ${{ steps.assets.outputs.build_windows }}
      build_any: ${{ steps.assets.outputs.build_any }}
      release_exists: ${{ steps.assets.outputs.release_exists }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          changelog_version="$(sed -n 's/^## \[\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\].*/\1/p' CHANGELOG.md | head -n 1)"
          config_version="$(sed -n 's/^  version: "\([^"]*\)"/\1/p' build/config.yml)"
          if [[ ! "${changelog_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=CHANGELOG.md::Expected the first release heading to contain a stable semantic version; found '${changelog_version}'."
            exit 1
          fi
          if [[ "${config_version}" != "${changelog_version}" ]]; then
            echo "::error file=build/config.yml::Version '${config_version}' does not match the latest changelog version '${changelog_version}'."
            exit 1
          fi
          release_tag="v${changelog_version}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match application version '${release_tag}'."
            exit 1
          fi
          echo "version=${changelog_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Select missing release archives
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 3 --output release.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          case "${status}" in
            200) echo 'release_exists=true' >> "${GITHUB_OUTPUT}" ;;
            404)
              printf '{"assets":[]}' > release.json
              echo 'release_exists=false' >> "${GITHUB_OUTPUT}"
              ;;
            *) echo "::error::GitHub release lookup failed with HTTP ${status}."; exit 1 ;;
          esac
          python3 scripts/release_plan.py "${PACKAGE_VERSION}" release.json

  quality:
    name: Verify release candidate
    needs: metadata
    if: needs.metadata.outputs.build_any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run Go tests with race detection
        run: |
          go test -race -coverprofile=coverage.out . ./cmd/... ./internal/...
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v total="${total}" 'BEGIN { if (total < 45) { printf "Go coverage %.1f%% is below 45%%\n", total; exit 1 } }'

      - name: Run Go vet
        run: go vet . ./cmd/... ./internal/...

      - name: Test and build frontend
        run: |
          pnpm --dir frontend test
          pnpm --dir frontend check
          pnpm --dir frontend build

  linux:
    name: Build Linux ${{ matrix.arch }}
    needs: [metadata, quality]
    if: needs.metadata.outputs.build_linux == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.linux_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install build tools and dependencies
        run: |
          pnpm --dir frontend install --frozen-lockfile
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build desktop app and CLI
        run: |
          wails3 task linux:build ARCH=${{ matrix.arch }} OUTPUT=bin/malina
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags="-s -w" -o bin/malina-cli ./cmd/malina

      - name: Package Linux release
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          package_dir="stage/malina-${PACKAGE_VERSION}-linux-${PACKAGE_ARCH}"
          mkdir -p "${package_dir}/bin" "${package_dir}/share/applications" "${package_dir}/share/icons/hicolor/512x512/apps" "${package_dir}/share/doc/malina" dist
          cp bin/malina bin/malina-cli "${package_dir}/bin/"
          cp build/linux/desktop "${package_dir}/share/applications/malina.desktop"
          cp build/appicon.png "${package_dir}/share/icons/hicolor/512x512/apps/malina.png"
          cp LICENSE README.md CHANGELOG.md "${package_dir}/share/doc/malina/"
          tar -C stage -czf "dist/malina-${PACKAGE_VERSION}-linux-${PACKAGE_ARCH}.tar.gz" "malina-${PACKAGE_VERSION}-linux-${PACKAGE_ARCH}"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    name: Build macOS universal
    needs: [metadata, quality]
    if: needs.metadata.outputs.build_macos == 'true'
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install build tools and dependencies
        run: |
          pnpm --dir frontend install --frozen-lockfile
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build universal desktop app and CLI
        run: |
          wails3 task darwin:package:universal
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/malina-cli-amd64 ./cmd/malina
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/malina-cli-arm64 ./cmd/malina
          lipo -create -output bin/malina-cli bin/malina-cli-amd64 bin/malina-cli-arm64

      - name: Package macOS release
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p "stage/malina-${PACKAGE_VERSION}-macos-universal" dist
          cp -R bin/malina.app "stage/malina-${PACKAGE_VERSION}-macos-universal/Malina.app"
          cp bin/malina-cli LICENSE README.md CHANGELOG.md "stage/malina-${PACKAGE_VERSION}-macos-universal/"
          ditto -c -k --sequesterRsrc --keepParent "stage/malina-${PACKAGE_VERSION}-macos-universal" "dist/malina-${PACKAGE_VERSION}-macos-universal.zip"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-universal
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    name: Build Windows amd64
    needs: [metadata, quality]
    if: needs.metadata.outputs.build_windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install build tools and dependencies
        shell: pwsh
        run: |
          pnpm --dir frontend install --frozen-lockfile
          go install github.com/wailsapp/wails/v3/cmd/wails3@${env:WAILS_VERSION}

      - name: Build desktop app and CLI
        shell: pwsh
        run: |
          wails3 task windows:build ARCH=amd64
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags="-s -w" -o bin/malina-cli.exe ./cmd/malina

      - name: Package Windows release
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $stage = "stage/malina-${env:PACKAGE_VERSION}-windows-amd64"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item bin/malina.exe, bin/malina-cli.exe, LICENSE, README.md, CHANGELOG.md -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "dist/malina-${env:PACKAGE_VERSION}-windows-amd64.zip"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - metadata
      - quality
      - linux
      - macos
      - windows
    if: >-
      ${{
        always() &&
        needs.metadata.result == 'success' &&
        needs.quality.result == 'success' &&
        needs.metadata.outputs.build_any == 'true' &&
        (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
        (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
        (needs.windows.result == 'success' || needs.windows.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download compiled artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Record newly built archives
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -name 'malina-*' -print | sort > new-archives.txt
          test -s new-archives.txt

      - name: Restore existing release archives
        if: needs.metadata.outputs.release_exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          for archive in \
            "malina-${PACKAGE_VERSION}-linux-amd64.tar.gz" \
            "malina-${PACKAGE_VERSION}-linux-arm64.tar.gz" \
            "malina-${PACKAGE_VERSION}-macos-universal.zip" \
            "malina-${PACKAGE_VERSION}-windows-amd64.zip"; do
            if [[ ! -f "dist/${archive}" ]]; then
              gh release download "${RELEASE_TAG}" --pattern "${archive}" --dir dist
            fi
          done

      - name: Create checksums and release notes
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            "malina-${PACKAGE_VERSION}-linux-amd64.tar.gz" \
            "malina-${PACKAGE_VERSION}-linux-arm64.tar.gz" \
            "malina-${PACKAGE_VERSION}-macos-universal.zip" \
            "malina-${PACKAGE_VERSION}-windows-amd64.zip" > SHA256SUMS
          cd ..
          awk -v version="${PACKAGE_VERSION}" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]:/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_EXISTS: ${{ needs.metadata.outputs.release_exists }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_EXISTS}" == "true" ]]; then
            mapfile -t new_archives < new-archives.txt
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" dist/SHA256SUMS --clobber
            gh release upload "${RELEASE_TAG}" "${new_archives[@]}"
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
