name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "24"
  PNPM_VERSION: "12"
  WAILS_VERSION: "v3.0.0-beta.23"

jobs:
  metadata:
    name: Resolve package metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve package version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^  version: "\([^"]*\)"/\1/p' build/config.yml)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=build/config.yml::Expected one stable semantic version, found '${version}'."
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "push" && "${REF_NAME#v}" != "${version}" ]]; then
            echo "::error file=build/config.yml::Tag '${REF_NAME}' does not match application version '${version}'."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  linux:
    name: Build Linux amd64
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install build tools and dependencies
        run: |
          pnpm --dir frontend install --frozen-lockfile
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build desktop app and CLI
        run: |
          wails3 task linux:build ARCH=amd64 OUTPUT=bin/malina
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/malina-cli ./cmd/malina

      - name: Package Linux release
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p "stage/malina-${PACKAGE_VERSION}-linux-amd64" dist
          cp bin/malina bin/malina-cli LICENSE README.md CHANGELOG.md "stage/malina-${PACKAGE_VERSION}-linux-amd64/"
          tar -C stage -czf "dist/malina-${PACKAGE_VERSION}-linux-amd64.tar.gz" "malina-${PACKAGE_VERSION}-linux-amd64"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-amd64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    name: Build macOS universal
    needs: metadata
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install build tools and dependencies
        run: |
          pnpm --dir frontend install --frozen-lockfile
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build universal desktop app and CLI
        run: |
          wails3 task darwin:package:universal
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/malina-cli-amd64 ./cmd/malina
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/malina-cli-arm64 ./cmd/malina
          lipo -create -output bin/malina-cli bin/malina-cli-amd64 bin/malina-cli-arm64

      - name: Package macOS release
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p "stage/malina-${PACKAGE_VERSION}-macos-universal" dist
          cp -R bin/malina.app "stage/malina-${PACKAGE_VERSION}-macos-universal/Malina.app"
          cp bin/malina-cli LICENSE README.md CHANGELOG.md "stage/malina-${PACKAGE_VERSION}-macos-universal/"
          ditto -c -k --sequesterRsrc --keepParent "stage/malina-${PACKAGE_VERSION}-macos-universal" "dist/malina-${PACKAGE_VERSION}-macos-universal.zip"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-universal
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    name: Build Windows amd64
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install build tools and dependencies
        shell: pwsh
        run: |
          pnpm --dir frontend install --frozen-lockfile
          go install github.com/wailsapp/wails/v3/cmd/wails3@${env:WAILS_VERSION}

      - name: Build desktop app and CLI
        shell: pwsh
        run: |
          wails3 task windows:build ARCH=amd64
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags="-s -w" -o bin/malina-cli.exe ./cmd/malina

      - name: Package Windows release
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $stage = "stage/malina-${env:PACKAGE_VERSION}-windows-amd64"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item bin/malina.exe, bin/malina-cli.exe, LICENSE, README.md, CHANGELOG.md -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "dist/malina-${env:PACKAGE_VERSION}-windows-amd64.zip"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - metadata
      - linux
      - macos
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download compiled artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums and release notes
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cd ..
          awk -v version="${PACKAGE_VERSION}" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]:/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "Malina ${PACKAGE_VERSION}" --notes-file release-notes.md
